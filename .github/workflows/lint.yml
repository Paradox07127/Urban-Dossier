name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check every Python file
        run: |
          set -e
          find . -type f -name "*.py" \
            -not -path "./node_modules/*" \
            -not -path "*/__pycache__/*" \
            -not -path "*/.venv/*" \
            -not -path "*/dist/*" \
            -not -path "*/index/*" \
            -print0 | xargs -0 python -m py_compile

  shell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on bash scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          find . -type f -name "*.sh" \
            -not -path "./node_modules/*" \
            -not -path "*/.venv/*" \
            -print0 | xargs -0 -r shellcheck -S warning || true
