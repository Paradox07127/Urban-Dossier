# GPU inference and vector-index profiles for the x86_64 workstation.
#
# Usage:
#   cp deploy/gpu.env.example /mnt/data/urban-dossier-state/runtime/gpu.env
#   docker compose --env-file /mnt/data/urban-dossier-state/runtime/gpu.env \
#     -f deploy/compose.gpu.yml --profile inference up -d
#
# Images are pinned to the digests validated on 2026-08-01.  Refreshing an
# image is an intentional maintenance operation: update the tag, pull it,
# validate it on the GPU, then replace the digest here.
name: urban-dossier

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-hf-cache: &hf-cache ${URBAN_DOSSIER_STATE_ROOT:-/mnt/data/urban-dossier-state}/hf-cache:/root/.cache/huggingface

services:
  llm:
    # vLLM 0.27.1, validated 2026-08-12 (previous: 0.23.0 @sha256:6d8429e3…).
    # 0.27.1 is required by the Nemotron 3.5 Lightning candidate; the incumbent
    # Nano checkpoint was regression-tested on it the same day.
    image: vllm/vllm-openai@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
    profiles: [inference]
    restart: unless-stopped
    # OpenShell rewrites the sandbox's inference.local route to
    # host.openshell.internal:8000. Host networking makes that route reachable
    # while the host nftables policy limits :8000 to loopback and Docker
    # bridge source addresses only.
    network_mode: host
    ipc: host
    shm_size: 16g
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ${URBAN_DOSSIER_STATE_ROOT:-/mnt/data/urban-dossier-state}/models/llm:/model:ro
      - *hf-cache
    entrypoint: [vllm]
    command:
      - serve
      - /model
      - --served-model-name
      - ${LLM_SERVED_NAME:-nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4}
      - --host
      - 0.0.0.0
      - --port
      - ${LLM_PORT:-8000}
      - --trust-remote-code
      - --gpu-memory-utilization
      - ${LLM_GPU_MEMORY_UTILIZATION:-0.45}
      - --max-model-len
      - ${LLM_MAX_MODEL_LEN:-32768}
      - --max-num-seqs
      - ${LLM_MAX_NUM_SEQS:-8}
      - --max-num-batched-tokens
      - ${LLM_MAX_BATCHED_TOKENS:-32768}
      - --kv-cache-dtype
      - ${LLM_KV_CACHE_DTYPE:-fp8}
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --mamba-ssm-cache-dtype
      - float32
      # vLLM 0.23 replaces the legacy VLLM_USE_FLASHINFER_MOE_FP4 and
      # VLLM_FLASHINFER_MOE_BACKEND variables with this CLI option.  CUTLASS is
      # the supported throughput backend for this Nemotron-H checkpoint.  The
      # SM12x b12x backend rejects its no-act-and-mul MLP layout in vLLM 0.23.
      - --moe-backend
      - ${LLM_MOE_BACKEND:-flashinfer_cutlass}
      - --reasoning-parser-plugin
      - /model/nano_v3_reasoning_parser.py
      - --reasoning-parser
      - nano_v3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
    <<: *gpu

  # ------------------------------------------------------------------------
  # Candidate models under side-by-side evaluation (2026-08-12).
  # See MODEL_CANDIDATES.md for the comparison tables and decision record.
  # Neither service belongs to the production `inference` profile; start them
  # explicitly and only while benchmarking:
  #   docker compose ... --profile candidate up -d llm-lightning
  #   docker compose ... --profile candidate-super up -d llm-super
  #   docker compose ... --profile candidate-qwen up -d llm-qwen38
  # llm-super needs the GPU essentially to itself (80.3 GiB of weights on a
  # 96 GiB card) — stop every other GPU service first.
  llm-lightning:
    # v0.27.1 is the model card's validated container for Nemotron 3.5
    # Lightning; replace the tag with a digest once the candidate is promoted.
    image: vllm/vllm-openai:v0.27.1
    profiles: [candidate]
    restart: unless-stopped
    network_mode: host
    ipc: host
    shm_size: 16g
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ${URBAN_DOSSIER_STATE_ROOT:-/mnt/data/urban-dossier-state}/models/llm-candidates/nemotron-3.5-lightning-30b-a3b-nvfp4:/model:ro
      - ${URBAN_DOSSIER_STATE_ROOT:-/mnt/data/urban-dossier-state}/models/llm-candidates/nemotron-3.5-lightning-30b-a3b-nvfp4-dspark:/draft:ro
      - *hf-cache
    entrypoint: [vllm]
    command:
      - serve
      - /model
      - --served-model-name
      - ${LIGHTNING_SERVED_NAME:-nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4}
      - --host
      - 0.0.0.0
      - --port
      - ${LIGHTNING_PORT:-8002}
      # No --trust-remote-code: nemotron_h for 3.5 is native in the
      # transformers version this image ships (the HF repo has no custom code).
      # 0.38 keeps the candidate co-resident with the production llm at 0.45
      # for A/B runs. 0.30 was enough when this service ran 32K context (the
      # 2026-08-12 A/B), but the 128K retune below made the engine's cache
      # reservation outgrow it: at 0.30 + 128K vLLM 0.27.1 exits with "No
      # available memory for the cache blocks" and the container crash-loops
      # (observed 2026-08-13, 23 restarts). 0.38 boots in 135 s alongside the
      # production llm, 76 GiB total on the 96 GiB card.
      - --gpu-memory-utilization
      - ${LIGHTNING_GPU_MEMORY_UTILIZATION:-0.38}
      # Measured 2026-08-12 on this card at 0.30: 1,337,288 KV-cache tokens
      # (40.8x concurrency at 32K).  The hybrid's tiny attention share makes
      # long context cheap, so serve 128K by default — still ~10x at full
      # length, and AA-LCR is where this model beats the incumbent hardest.
      - --max-model-len
      - ${LIGHTNING_MAX_MODEL_LEN:-131072}
      - --max-num-seqs
      - ${LIGHTNING_MAX_NUM_SEQS:-8}
      - --max-num-batched-tokens
      - ${LIGHTNING_MAX_BATCHED_TOKENS:-32768}
      - --kv-cache-dtype
      - fp8
      - --enable-prefix-caching
      # Overlaps CPU-side scheduling with GPU execution. The model card lists
      # it among the flags that apply to every hardware profile and we did not
      # have it; it was incompatible with speculative decoding in vLLM <=0.10
      # and is not in this image's defaults, which is presumably how it got
      # missed. Verified booting with the DSpark drafter on 0.27.1.
      - --async-scheduling
      # The project was built on DGX Spark (GB10); this box is an RTX PRO 6000
      # Blackwell, SM 12.0, for which NVIDIA publishes no recipe. We follow the
      # DGX Spark profile as the closest validated single-GPU one.
      #
      # marlin is not a workaround here, it is what vLLM picks anyway.
      # Measured on this box, 0.27.1, 2026-08-15 with --moe-backend auto:
      #   Using 'MARLIN' NvFp4 MoE backend out of potential backends:
      #   [FLASHINFER_TRTLLM, FLASHINFER_CUTEDSL, FLASHINFER_CUTEDSL_BATCHED,
      #    FLASHINFER_CUTLASS, VLLM_CUTLASS, MARLIN, HUMMING, EMULATION]
      #   WARNING: Your GPU does not have native support for FP4 computation
      # Setting it explicitly only pins that choice.
      #
      # Native NVFP4 on SM 12.0 is still unfixed upstream (vLLM #31085 open;
      # the CUTLASS #3096 fix needs CUDA 13.0 + compute_120f and ~10 hand
      # patches to FlashInfer, none upstreamed) and lands at ~39 tok/s against
      # marlin's 46-49 even when it works. There is no upside to chase.
      #
      # Two dead ends, both measured here rather than inferred:
      #   default          not a valid value at all -- argparse rejects it and
      #                    the container never starts.
      #   flashinfer_b12x  the newer SM120/121 path; loads, then dies with
      #                    RuntimeError: shape '[344064, 116]' is invalid for
      #                    input of size 41287680.
      # The garbage-output reports on SM 12.0 come from FORCING
      # flashinfer_cutlass / vllm_cutlass. auto never selects them, so the
      # danger is in overriding this flag, not in leaving it alone.
      - --moe-backend
      - ${LIGHTNING_MOE_BACKEND:-marlin}
      - --mamba-backend
      - flashinfer
      - --mamba-cache-mode
      - align
      # DSpark drafter, 3 tokens -- the card's DGX Spark and H100-interactive
      # number (GB200 uses 5).
      #
      # Lightning ships THREE draft paths and they are not interchangeable:
      #   MTP     multi-token prediction baked into the checkpoint during
      #           pretraining. No extra download, no second model in memory.
      #           NVIDIA recommends it for medium-to-high concurrency, with
      #           the optimal draft length falling as concurrency rises.
      #   DSpark  a separate 967M dense GQA drafter (615M non-embedding,
      #           sliding window 1024 on all layers). Built for compact
      #           Blackwell -- DGX Spark GB10 -- and low-concurrency data
      #           centre work. Best acceptance of the three: 3.75 average
      #           accepted length on SPEED-Bench at draft length 7.
      #   DFlash  the other separate drafter, aimed at data centre GPUs and
      #           high-end local systems, and its card names GeForce RTX 5090
      #           -- consumer/workstation Blackwell, i.e. THIS box's silicon
      #           class, which DSpark's target list does not include.
      #           Acceptance 3.16 at draft length 7.
      #
      # So the two disagree: DSpark accepts more tokens per step, DFlash is
      # the one aimed at this hardware. NVIDIA's guidance is to benchmark
      # DFlash per workload rather than assume.
      #
      # Measured here 2026-08-20, and DSpark keeps the slot on merit rather
      # than inheritance: at THIS draft length DFlash kills the engine
      # (CUDA device-side assert; the draft proposes token id -1), and at
      # draft length 1 -- the only length where it runs -- DSpark is 1.8x
      # faster at both C1 and C4. vLLM 0.27.1 registers both architectures,
      # so this is a runtime bug, not a missing implementation. Do not swap
      # /draft to the DFlash checkpoint without re-measuring on a newer vLLM.
      # Table and evidence in MODEL_CANDIDATES.md.
      - --speculative_config.model
      - /draft
      - --speculative_config.num_speculative_tokens
      - "3"
      # nemotron_v3 is built into vLLM 0.27; the nano_v3 plugin file that the
      # production service mounts is not needed here.
      - --reasoning-parser
      - nemotron_v3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
    <<: *gpu

  llm-super:
    image: vllm/vllm-openai:v0.27.1
    profiles: [candidate-super]
    restart: unless-stopped
    network_mode: host
    ipc: host
    shm_size: 16g
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ${URBAN_DOSSIER_STATE_ROOT:-/mnt/data/urban-dossier-state}/models/llm-candidates/nemotron-3-super-120b-a12b-nvfp4:/model:ro
      - *hf-cache
    entrypoint: [vllm]
    command:
      - serve
      - /model
      - --served-model-name
      - ${SUPER_SERVED_NAME:-nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-NVFP4}
      - --host
      - 0.0.0.0
      - --port
      - ${SUPER_PORT:-8003}
      - --trust-remote-code
      # 80.3 GiB of NVFP4 weights on the 96 GiB RTX PRO 6000: the card's
      # stated minimum is 1x B200 or DGX Spark, so this is off-label.  0.92
      # leaves roughly 10 GiB for KV + Mamba state — hence the short context
      # and 2-sequence cap.  Expect OOM to be a real possible outcome.
      - --gpu-memory-utilization
      - ${SUPER_GPU_MEMORY_UTILIZATION:-0.92}
      # Measured 2026-08-12: weights + non-torch 79.5 GiB, KV cache 5.68 GiB
      # = 356,937 tokens (10.9x at 32K) — no OOM.  64K context at 4 seqs
      # still leaves ~2.7x headroom at full length.
      - --max-model-len
      - ${SUPER_MAX_MODEL_LEN:-65536}
      - --max-num-seqs
      - ${SUPER_MAX_NUM_SEQS:-4}
      - --kv-cache-dtype
      - fp8
      # float16 Mamba state per the official recipe: memory-constrained hosts
      # trade a sliver of accuracy for state that is half the size.
      - --mamba-ssm-cache-dtype
      - float16
      - --enable-chunked-prefill
      - --async-scheduling
      - --moe-backend
      - ${SUPER_MOE_BACKEND:-marlin}
      # Native MTP speculative decoding (the drafter lives inside the
      # checkpoint) — from the model card's DGX Spark command.
      - --speculative_config
      - '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
      # Super ships its own reasoning parser next to the weights.
      - --reasoning-parser-plugin
      - /model/super_v3_reasoning_parser.py
      - --reasoning-parser
      - super_v3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
    <<: *gpu

  # Qwen3.8-27B (2026-08-14).  The first non-Nemotron candidate, and the only
  # DENSE one: 27B active every token against Lightning's 30B-A3B MoE (3B
  # active).  Read every throughput number here with that in mind — this
  # model is not expected to win on tokens/s, it is here to answer whether a
  # dense 27B is enough better at the agent's job to be worth the latency.
  #
  # Architecture is a Gated DeltaNet hybrid: 16 x (3 x GDN -> FFN, 1 x gated
  # attention -> FFN).  Only a quarter of the layers hold a KV cache, so long
  # context is cheap; the rest hold recurrent state sized by
  # --mamba-ssm-cache-dtype.
  #
  # Checkpoint: Inferact/Qwen3.8-27B-NVFP4, the NVFP4 build vLLM's own recipe
  # page names for the single-GPU (TP1) profile.  It quantizes every Linear to
  # W4A4 but excludes the linear_attn projections and conv1d, lm_head and
  # embed_tokens -- the right call for a GDN hybrid, whose recurrent state is
  # precision-sensitive.  unsloth's same-named NVFP4 is mixed-precision (FP4
  # only on the MLPs, FP8 elsewhere) and 22.5 GiB; keep it as the fallback if
  # this one misbehaves.
  llm-qwen38:
    # 0.27.1 registers Qwen3_5ForConditionalGeneration natively (verified
    # against this exact image on 2026-08-14), so no --trust-remote-code and
    # no image bump is needed for the base serving path.
    image: vllm/vllm-openai:v0.27.1
    profiles: [candidate-qwen]
    restart: unless-stopped
    network_mode: host
    ipc: host
    shm_size: 16g
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - ${URBAN_DOSSIER_STATE_ROOT:-/mnt/data/urban-dossier-state}/models/llm-candidates/qwen3.8-27b-nvfp4:/model:ro
      - *hf-cache
    entrypoint: [vllm]
    command:
      - serve
      - /model
      - --served-model-name
      - ${QWEN38_SERVED_NAME:-Qwen/Qwen3.8-27B-NVFP4}
      - --host
      - 0.0.0.0
      - --port
      - ${QWEN38_PORT:-8004}
      # 25.5 GiB of weights.  0.45 leaves room for the KV cache, the GDN
      # recurrent state and the vision tower, and adds to Lightning's 0.38 for
      # 0.83 of the card -- the same total the Nano+Lightning A/B ran at on
      # 2026-08-12, so the two candidates can be co-resident for a same-session
      # comparison.
      - --gpu-memory-utilization
      - ${QWEN38_GPU_MEMORY_UTILIZATION:-0.45}
      # 262144 native (1M with YaRN), but pinned to Lightning's 131072 so the
      # side-by-side varies the model and nothing else.
      - --max-model-len
      - ${QWEN38_MAX_MODEL_LEN:-131072}
      - --max-num-seqs
      - ${QWEN38_MAX_NUM_SEQS:-8}
      - --max-num-batched-tokens
      - ${QWEN38_MAX_BATCHED_TOKENS:-32768}
      - --kv-cache-dtype
      - fp8
      - --enable-prefix-caching
      - --enable-chunked-prefill
      # float32 GDN state: the hybrid keeps attention KV for only a quarter of
      # its layers, so there is headroom to spend on state precision here that
      # llm-super (float16) does not have.
      - --mamba-ssm-cache-dtype
      - float32
      # Dense model -- no --moe-backend.  MTP speculative decoding is NOT
      # enabled yet: the checkpoint ships the head (nvfp4_experts_mtp
      # .safetensors) and 0.27.1 registers Qwen3_5MTP, but the GDN speculative
      # path is the one piece reported unfixed in a released tag.  Measure the
      # base path first, then try:
      #   --speculative_config '{"method":"mtp","num_speculative_tokens":3}'
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
    <<: *gpu

  rapids-smoke:
    image: rapidsai/base@sha256:c6c8424ecefd77bdf3d4058b42175cdf9f005d3ff3d58f0b8ce18b779ed4c895
    profiles: [gpu-index]
    restart: "no"
    entrypoint: [python]
    command:
      - -c
      - >-
        import cupy, cudf, cuvs;
        print({"gpu": cupy.cuda.runtime.getDeviceProperties(0)["name"].decode(),
        "cudf": cudf.__version__, "cuvs": cuvs.__version__})
    <<: *gpu
