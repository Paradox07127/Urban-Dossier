[pytest]
# Both source trees the test suite imports from.  These are resolved against
# pytest's rootdir, which is why this file must be tracked and must live at
# the repo root: an untracked copy in the main checkout makes rootdir resolve
# there for runs started inside .claude/worktrees/*, and pytest prepends these
# to sys.path ahead of any PYTHONPATH.  A worktree then silently tests the
# main checkout's code and reports green for changes it never loaded
# (observed 2026-08-14).
#
# A second worktree trap, same shape: `data/` is a local, gitignored directory
# that exists only in the main checkout, so config._discover_data_root()
# returns None inside a worktree and test_preprocess_nyccas_no.py fails at
# COLLECTION -- taking the whole run with it, before a single test executes.
# A third, and the one that bites AFTER the run starts: READY_DATA_DIR does
# not follow URBAN_DOSSIER_DATA_ROOT. config.py resolves it from its own
# variable, defaulting to REPO_ROOT/data/ready -- which in a worktree is a
# directory that does not exist. Collection succeeds, 423 tests pass, and the
# 16 that read a prepared parquet fail with assertions that look like real
# regressions (`available is True`, empty search results, empty timelines)
# while the code under test is fine. Observed 2026-08-20.
#
# Run from a worktree with BOTH roots passed in explicitly:
#   URBAN_DOSSIER_DATA_ROOT=/mnt/data/Urban-Dossier/data \
#   URBAN_DOSSIER_READY_ROOT=/mnt/data/Urban-Dossier/data/ready \
#     pytest backend/tests skills/urban_dossier_analyst/tests
# 439 passed, 2026-08-20.
pythonpath =
    backend/src
    skills
