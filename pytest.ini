[pytest]
# Both source trees the test suite imports from.  These are resolved against
# pytest's rootdir, which is why this file must be tracked and must live at
# the repo root: an untracked copy in the main checkout makes rootdir resolve
# there for runs started inside .claude/worktrees/*, and pytest prepends these
# to sys.path ahead of any PYTHONPATH.  A worktree then silently tests the
# main checkout's code and reports green for changes it never loaded
# (observed 2026-08-14).
pythonpath =
    backend/src
    skills
